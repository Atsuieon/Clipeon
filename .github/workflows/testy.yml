# Testy: Clipeon działa tylko na Windows, więc testy jednostkowe uruchamiamy na windows-latest
# (po każdym PR i wypchnięciu gałęzi roboczej).
name: Testy

on:
  pull_request:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Testy jednostkowe
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets

  # Okno (HTML + JS) w Chromium z udawanym Tauri: łapie błędy, przez które skrypt okna staje przy starcie
  okno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Playwright z Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Test okna
        run: node testy/okno.mjs
