[package]
name = "clipeon"
version = "1.2.0"
edition = "2024"
description = "Lekkie nagrywanie powtórek z gier dla Windows"
authors = ["Atsuieon"]
license = "MIT"
repository = "https://github.com/Atsuieon/Clipeon"

[dependencies]
base64 = "0.22"
drag = "2.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
toml = "1.2.1"
trash = "5.3.0"
ureq = "3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_Graphics_Dxgi", "Win32_System_Recovery"] }
windows-capture = "2.0.1"
windows-registry = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }
